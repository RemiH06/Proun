<style>
  :root {
    --ariadne-bg: #f5f5f7;
    --ariadne-text: #1c1c1e;
    --ariadne-link: #c7c7cc;
    --ariadne-accent: #007aff;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ariadne-bg);
    color: var(--ariadne-text);
    font-family: system-ui, sans-serif;
  }
  #ariadne-app {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }
  #ariadne-svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  #ariadne-controls-toggle {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 11;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ariadne-bg);
    color: var(--ariadne-text);
    border: 1px solid var(--ariadne-link);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
    transition: border-color 0.15s ease;
  }
  #ariadne-controls-toggle:hover {
    border-color: var(--ariadne-accent);
  }
  #ariadne-controls {
    position: absolute;
    top: 12px;
    left: 54px;
    z-index: 10;
    background: var(--ariadne-bg);
    border: 1px solid var(--ariadne-link);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  #ariadne-controls.ariadne-collapsed {
    opacity: 0;
    transform: translateX(-8px);
    pointer-events: none;
  }
  #ariadne-selection-toggle {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 11;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ariadne-bg);
    color: var(--ariadne-text);
    border: 1px solid var(--ariadne-link);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
    transition: border-color 0.15s ease;
  }
  #ariadne-selection-toggle:hover {
    border-color: var(--ariadne-accent);
  }
  #ariadne-selection-panel {
    position: absolute;
    top: 12px;
    right: 54px;
    z-index: 10;
    width: 260px;
    background: var(--ariadne-bg);
    border: 1px solid var(--ariadne-link);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  #ariadne-selection-panel.ariadne-collapsed {
    opacity: 0;
    transform: translateX(8px);
    pointer-events: none;
  }
  .ariadne-legend {
    display: flex;
    gap: 18px;
  }
  .ariadne-legend-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .ariadne-legend-subtitle {
    font-size: 10px;
    opacity: 0.55;
  }
  .ariadne-legend-row {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
  }
  .ariadne-legend-shape, .ariadne-legend-swatch {
    width: 13px;
    height: 13px;
    flex: 0 0 auto;
    background: var(--ariadne-link);
  }
  .ariadne-legend-swatch {
    border-radius: 3px;
  }
  .ariadne-legend-circle { border-radius: 50%; }
  .ariadne-legend-diamond { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
  .ariadne-legend-triangle { clip-path: polygon(50% 0%, 100% 100%, 0% 100%); }
  .ariadne-legend-pentagon { clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }
  .ariadne-legend-octagon { clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%); }
  .ariadne-legend-hexagon { clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
  .ariadne-legend-folder { clip-path: polygon(0% 20%, 42% 20%, 52% 2%, 100% 2%, 100% 100%, 0% 100%); }
  .ariadne-legend-book { position: relative; border-radius: 2px; }
  .ariadne-legend-book::after {
    content: "";
    position: absolute;
    left: 32%;
    top: 15%;
    bottom: 15%;
    width: 1.5px;
    background: rgba(0, 0, 0, 0.4);
    box-shadow: 3px 0 0 rgba(0, 0, 0, 0.4);
  }
  #ariadne-controls .ariadne-title {
    font-size: 14px;
    font-weight: 700;
  }
  .ariadne-section {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ariadne-section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.6;
  }
  .ariadne-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ariadne-btn {
    display: inline-block;
    background: transparent;
    color: var(--ariadne-text);
    border: 1px solid var(--ariadne-link);
    border-radius: 6px;
    padding: 4px 9px;
    font: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .ariadne-btn:hover {
    border-color: var(--ariadne-accent);
  }
  .ariadne-btn.active {
    background: var(--ariadne-accent);
    border-color: var(--ariadne-accent);
    color: var(--ariadne-bg);
    font-weight: 600;
  }
  .ariadne-compass {
    display: grid;
    grid-template-columns: repeat(3, 28px);
    grid-auto-rows: 28px;
    gap: 4px;
  }
  .ariadne-compass button {
    width: 28px;
    height: 28px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ariadne-dir-icon {
    width: 15px;
    height: 15px;
    color: inherit;
  }
  #ariadne-controls label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #ariadne-controls input[type="number"],
  #ariadne-controls input[type="text"] {
    width: 90px;
    background: transparent;
    color: var(--ariadne-text);
    border: 1px solid var(--ariadne-link);
    border-radius: 4px;
    padding: 2px 6px;
    font: inherit;
  }
  .ariadne-node-label {
    pointer-events: none;
    user-select: none;
  }
  .ariadne-links path, .ariadne-ref-links path {
    transition: opacity 0.15s ease;
  }
  .ariadne-node.ariadne-focused .ariadne-node-box {
    filter: url(#focus-glow);
  }
  [hidden] {
    display: none !important;
  }
  .ariadne-selection-label {
    font-weight: 600;
    word-break: break-word;
  }
  .ariadne-history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 220px;
    overflow-y: auto;
  }
  .ariadne-history-row {
    display: flex;
    flex-direction: column;
    gap: 1px;
    border-left: 2px solid var(--ariadne-link);
    padding-left: 7px;
  }
  .ariadne-history-meta {
    font-size: 10px;
    opacity: 0.6;
  }
  .ariadne-history-subject {
    font-size: 12px;
  }
  .ariadne-node-doc-star {
    color: #007aff;
    pointer-events: none;
  }
</style>
</head>
